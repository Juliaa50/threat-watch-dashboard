

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Threat Intelligence Dashboard</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            background: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
        }

        header {
            margin-bottom: 30px;
        }

        h1 {
            color: #38bdf8;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
        }

        .card h2 {
            font-size: 30px;
            margin-bottom: 5px;
        }

        .vulnerability {
            background: #1e293b;
            padding: 18px;
            margin-top: 15px;
            border-radius: 10px;
        }

        a {
            color: #38bdf8;
        }

        .severity {
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>Cyber Threat Intelligence</h1>
    <p>Monitoring publicly disclosed cybersecurity vulnerabilities.</p>
    <p id="updated">Loading latest data...</p>
</header>

<section class="cards">
    <div class="card">
        <h2 id="total">--</h2>
        <p>Total Vulnerabilities</p>
    </div>

    <div class="card">
        <h2 id="critical">--</h2>
        <p>Critical</p>
    </div>

    <div class="card">
        <h2 id="high">--</h2>
        <p>High</p>
    </div>

    <div class="card">
        <h2 id="medium">--</h2>
        <p>Medium</p>
    </div>

    <div class="card">
        <h2 id="low">--</h2>
        <p>Low</p>
    </div>
</section>

<h2>Vulnerability Explorer</h2>

<input
    type="text"
    id="searchInput"
    placeholder="Search CVE ID or description..."
>

<select id="severityFilter">
    <option value="ALL">All Severities</option>
    <option value="CRITICAL">Critical</option>
    <option value="HIGH">High</option>
    <option value="MEDIUM">Medium</option>
    <option value="LOW">Low</option>
    <option value="UNKNOWN">Unknown</option>
</select>

<h3 id="resultCount"></h3>

<section id="vulnerabilities">
    Loading vulnerability records...
</section>

<script> 
      
let allVulnerabilities = [];

async function loadThreats() {
    try {
        const response = await fetch("./data/vulnerabilities.json");

        if (!response.ok) {
            throw new Error("Unable to load vulnerability data");
        }

        const data = await response.json();

        allVulnerabilities = data.vulnerabilities || [];

        updateDashboard(data);
        renderVulnerabilities();

        document.getElementById("updated").textContent =
            "Last updated: " + data.last_updated;

    } catch (error) {
        console.error("Dashboard error:", error);

        document.getElementById("vulnerabilities").textContent =
            "Unable to load vulnerability data.";
    }
}


function updateDashboard(data) {

    const counts = {
        CRITICAL: 0,
        HIGH: 0,
        MEDIUM: 0,
        LOW: 0
    };

    allVulnerabilities.forEach(v => {
        const severity = (v.severity || "UNKNOWN").toUpperCase();

        if (Object.hasOwn(counts, severity)) {
            counts[severity]++;
        }
    });

    document.getElementById("total").textContent =
        allVulnerabilities.length;

    document.getElementById("critical").textContent =
        counts.CRITICAL;

    document.getElementById("high").textContent =
        counts.HIGH;

    document.getElementById("medium").textContent =
        counts.MEDIUM;

    document.getElementById("low").textContent =
        counts.LOW;
}


function renderVulnerabilities() {

    const searchTerm =
        document.getElementById("searchInput").value.toLowerCase();

    const selectedSeverity =
        document.getElementById("severityFilter").value;

    const filtered = allVulnerabilities.filter(v => {

        const severity =
            (v.severity || "UNKNOWN").toUpperCase();

        const matchesSearch =
            (v.id || "").toLowerCase().includes(searchTerm) ||
            (v.description || "").toLowerCase().includes(searchTerm);

        const matchesSeverity =
            selectedSeverity === "ALL" ||
            severity === selectedSeverity;

        return matchesSearch && matchesSeverity;
    });

    const container =
        document.getElementById("vulnerabilities");

    container.replaceChildren();

    filtered.forEach(v => {

        const card = document.createElement("article");
        card.className = "vulnerability";

        const heading = document.createElement("h3");
        const link = document.createElement("a");

        link.href =
            "https://nvd.nist.gov/vuln/detail/" +
            encodeURIComponent(v.id);

        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = v.id || "Unknown CVE";

        heading.appendChild(link);

        const description = document.createElement("p");
        description.textContent = v.description || "No description available";

        const severity = document.createElement("p");
        severity.textContent =
            "Severity: " + (v.severity || "Unknown");

        const score = document.createElement("p");
        score.textContent =
            "CVSS Score: " + (v.score ?? "Not available");

        card.append(heading, description, severity, score);

        container.appendChild(card);
    });

    document.getElementById("resultCount").textContent =
        "Showing " + filtered.length + " of " +
        allVulnerabilities.length + " vulnerabilities";
}


// Connect search and filter controls
document.getElementById("searchInput")
    .addEventListener("input", renderVulnerabilities);

document.getElementById("severityFilter")
    .addEventListener("change", renderVulnerabilities);


// Load dashboard when the page is ready
document.addEventListener("DOMContentLoaded", loadThreats);

</script>

</body>
</html>
