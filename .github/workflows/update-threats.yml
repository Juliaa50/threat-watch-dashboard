
name: Update Threat Intelligence

on:
  schedule:
    - cron: "0 4 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-threats:
    runs-on: ubuntu-latest

    concurrency:
      group: update-threat-intelligence
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect vulnerability information
        run: python scripts/collect_threats.py

      - name: Save updated vulnerability data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/vulnerabilities.json

          if git diff --cached --quiet; then
            echo "No changes to vulnerability data."
            exit 0
          fi

          git commit -m "Update threat intelligence data"

          git pull --rebase origin main

          git push origin HEAD:main
